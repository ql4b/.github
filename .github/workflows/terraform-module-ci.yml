name: Terraform Module CI

# Reusable CI/release workflow for ql4b Terraform modules.
#
# Extracted from terraform-aws-ec2-proxy (the lifecycle template). A module
# consumes it with a thin caller workflow:
#
#   # .github/workflows/release.yml in the module repo
#   name: Release
#   on:
#     push:
#       branches: [main, "+([0-9])?(.{+([0-9]),x}).x"]
#     pull_request:
#       branches: [main]
#       types: [opened, synchronize, reopened]
#   jobs:
#     ci:
#       uses: ql4b/.github/.github/workflows/terraform-module-ci.yml@main
#       # Override only what differs from the defaults below, e.g.:
#       # with:
#       #   checkov_skip: "CKV_TF_1,CKV_AWS_382,CKV_AWS_341"
#       #   unit_test_filter: tests/unit.tftest.hcl
#       secrets: inherit
#
# The caller owns the `on:` triggers; this workflow keys its push-only jobs
# (docs, release) off github.event_name, which the reusable workflow still sees.

on:
  workflow_call:
    inputs:
      terraform_version:
        description: "Terraform version constraint for setup-terraform."
        type: string
        default: "~> 1.7"
      working_dir:
        description: "Directory to run terraform/terraform-docs in."
        type: string
        default: "."
      checkov_skip:
        description: "Comma-separated Checkov check IDs to skip."
        type: string
        default: "CKV_TF_1,CKV_AWS_382"
      unit_test_filter:
        description: "terraform test filter for the unit suite. Empty string skips unit tests."
        type: string
        default: "tests/unit.tftest.hcl"
      run_docs:
        description: "Run the terraform-docs auto-commit job on push."
        type: boolean
        default: true
      run_release:
        description: "Run semantic-release on push."
        type: boolean
        default: true

# Least privilege by default; jobs opt into elevated scopes as needed.
permissions:
  contents: read

# Serialize runs that push to the branch. The docs and release jobs both
# commit and push back, so two runs racing (e.g. several PRs merged in quick
# succession) collide on a non-fast-forward push. Queue per-ref instead of
# cancelling, so no run's doc/release push is dropped.
concurrency:
  group: tf-module-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working_dir }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ inputs.terraform_version }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: latest

      - name: Run TFLint
        run: |
          tflint --init
          tflint

      - name: Run Unit Tests
        if: inputs.unit_test_filter != ''
        run: terraform test -filter=${{ inputs.unit_test_filter }}

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@c3e106d5f8f4253a6de5110efb41a080f83db294 # v12.3135.0
        with:
          directory: ${{ inputs.working_dir }}
          framework: terraform
          quiet: true
          skip_check: ${{ inputs.checkov_skip }}

  docs:
    name: Update Docs
    needs: validate
    if: github.event_name == 'push' && inputs.run_docs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Generate terraform-docs
        uses: terraform-docs/gh-actions@6de6da0cefcc6b4b7a5cbea4d79d97060733093c # v1.4.1
        with:
          working-dir: ${{ inputs.working_dir }}
          output-file: README.md
          output-method: inject
          git-push: true
          git-commit-message: "docs: auto-update terraform-docs"

  release:
    name: Semantic Release
    needs: [validate, docs]
    if: github.event_name == 'push' && inputs.run_release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Pull latest (after docs job may have pushed)
        run: git pull --ff-only origin ${{ github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install semantic-release plugins
        run: npm install --no-save semantic-release @semantic-release/commit-analyzer @semantic-release/release-notes-generator @semantic-release/changelog @semantic-release/github @semantic-release/git conventional-changelog-conventionalcommits@7

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
